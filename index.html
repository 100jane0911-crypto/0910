<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星露谷小助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood-dark: #4A2810;
      --wood-main: #8E5327;
      --wood-border: #D29D64;
      --parchment: #FEE8C8;
      --parchment-deep: #F3CEA1;
      --text-dark: #3F1D0B;
      --text-soft: #7A533E;
      --green-leaf: #388E3C;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      padding: 16px;
      padding-bottom: 50px;
      background: #D9BE9B url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" fill="%23D9BE9B"/><rect x="0" y="0" width="20" height="20" fill="%23D3B58E"/></svg>');
      background-size: 20px 20px;
      font-family: 'Zen Maru Gothic', -apple-system, sans-serif;
      color: var(--text-dark);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 3px dashed var(--wood-main);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      color: var(--wood-dark);
      text-shadow: 1px 1px 0px #FFF;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pixel-btn {
      position: relative;
      background: var(--wood-main);
      color: #FFF;
      border: 3px solid var(--wood-dark);
      box-shadow: inset 2px 2px 0px var(--wood-border), 3px 3px 0px rgba(0,0,0,0.25);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.05s ease;
    }
    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: inset 2px 2px 0px var(--wood-border), 1px 1px 0px rgba(0,0,0,0.25);
    }
    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }
    .file-input-wrapper input[type=file] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      height: 100%;
      width: 100%;
    }

    .wood-box {
      background: var(--parchment);
      border: 4px solid var(--wood-dark);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: inset 0 0 0 3px var(--wood-border), 0 6px 0px rgba(74, 40, 16, 0.3);
      position: relative;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
    }
    .empty-state span {
      font-size: 50px;
      display: block;
      margin-bottom: 12px;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .farmer-card {
      background: linear-gradient(180deg, #FFF1DB 0%, var(--parchment) 100%);
    }
    .farmer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .farmer-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--wood-dark);
    }
    .farmer-money {
      font-family: 'VT323', monospace;
      font-size: 26px;
      font-weight: bold;
      color: #936000;
      background: #FFE8A3;
      border: 2px solid #CCA045;
      padding: 2px 10px;
      border-radius: 20px;
      box-shadow: inset 1px 1px 0px #FFF;
    }
    .farmer-date {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-soft);
      font-weight: 700;
    }

    .weather-box {
      background: linear-gradient(135deg, #E6F5F8 0%, #CEE7EE 100%);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .weather-icon {
      font-size: 46px;
      filter: drop-shadow(2px 3px 0px rgba(0,0,0,0.1));
    }
    .weather-text {
      font-size: 20px;
      font-weight: 900;
      color: #1F4550;
    }

    .crop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }
    .crop-badge {
      background: #FAF0DF;
      border: 2px solid var(--wood-border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .crop-badge.ready {
      background: #E8F5E9;
      border-color: #81C784;
    }
    .crop-val {
      font-family: 'VT323', monospace;
      font-size: 32px;
      line-height: 1;
      font-weight: bold;
      color: var(--wood-dark);
    }
    .crop-badge.ready .crop-val { color: var(--green-leaf); }
    .crop-lbl { font-size: 12px; font-weight: 700; color: var(--text-soft); margin-top: 2px; }

    .section-label {
      font-size: 15px;
      font-weight: 900;
      color: var(--wood-dark);
      margin: 18px 0 8px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .villager-card {
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .v-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .v-name {
      font-size: 16px;
      font-weight: 900;
      color: var(--wood-dark);
    }
    .v-bday {
      font-size: 11px;
      font-weight: 700;
      background: var(--parchment-deep);
      border: 1px solid var(--wood-border);
      padding: 2px 8px;
      border-radius: 12px;
      color: var(--wood-dark);
    }
    .heart-track {
      font-size: 13px;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .pts-text {
      font-family: 'VT323', monospace;
      font-size: 16px;
      color: var(--text-soft);
      letter-spacing: 0;
    }
    .gift-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .gift-tag {
      background: #FFFFFF;
      border: 1px solid #DFCCB7;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: #794C2F;
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
  </style>
</head>
<body>

  <header>
    <h1>🐔 谷地小夥伴</h1>
    <div class="file-input-wrapper">
      <button class="pixel-btn" id="btnText">📂 讀取存檔</button>
      <input type="file" id="saveFileInput" accept="*/*" />
    </div>
  </header>

  <div id="emptyView" class="wood-box empty-state">
    <span>🌾</span>
    <div style="font-weight: 900; font-size: 16px; margin-bottom: 6px;">尚未讀取星露谷存檔</div>
    <div style="font-size: 13px; color: var(--text-soft); line-height: 1.6;">
      請點擊右上角的「讀取存檔」按鈕<br>選取存檔主檔案或 _SVBAK 備份檔即可！
    </div>
  </div>

  <main id="mainView" style="display: none;">
    <!-- 農夫狀態 -->
    <div class="wood-box farmer-card">
      <div class="farmer-row">
        <div class="farmer-title" id="dispFarmer">農夫的農場</div>
        <div class="farmer-money" id="dispMoney">0 G</div>
      </div>
      <div class="farmer-date" id="dispDate">第 1 年・春季 1 日</div>
    </div>

    <!-- 明日天氣推算 -->
    <div class="wood-box weather-box">
      <div class="weather-icon" id="dispWeatherIcon">☀️</div>
      <div>
        <div style="font-size: 11px; font-weight: bold; color: #4F7985;">電視預報 / 明日天氣</div>
        <div class="weather-text" id="dispWeatherText">晴天</div>
      </div>
    </div>

    <!-- 作物即時狀態 -->
    <div class="section-label">🌱 農田作物成熟進度</div>
    <div class="wood-box" style="padding: 12px;">
      <div class="crop-grid">
        <div class="crop-badge ready">
          <div class="crop-val" id="readyCount">0</div>
          <div class="crop-lbl">🌾 今日已成熟</div>
        </div>
        <div class="crop-badge">
          <div class="crop-val" id="growingCount">0</div>
          <div class="crop-lbl">💧 生長中作物</div>
        </div>
      </div>
    </div>

    <!-- 村民好感度追蹤 -->
    <div class="section-label">💌 村民好感度與喜好追蹤</div>
    <div id="villagerContainer"></div>
  </main>

  <script>
    const villagerMeta = {
      Robin: { name: "羅賓", bday: "秋季 21 日", gifts: ["山羊起司", "桃子", "義大利麵", "硬木"] },
      Penny: { name: "潘妮", bday: "秋季 2 日", gifts: ["鑽石", "祖母綠", "甜瓜", "虞美人花", "紅甘藍燉菜"] },
      Jas: { name: "賈斯", bday: "夏季 4 日", gifts: ["粉紅蛋糕", "梅子布丁", "妖精玫瑰"] },
      Pam: { name: "潘姆", bday: "春季 18 日", gifts: ["啤酒", "仙人掌果實", "防風草", "防風草湯"] },
      Lewis: { name: "劉易斯", bday: "春季 7 日", gifts: ["秋日豐收", "辣椒", "綠茶", "蔬菜雜燴"] },
      Maru: { name: "瑪魯", bday: "夏季 10 日", gifts: ["鑽石", "金條", "銥條", "電池組", "草莓"] },
      Haley: { name: "海莉", bday: "春季 14 日", gifts: ["向日葵", "粉紅蛋糕", "椰子", "水果沙拉"] },
      Sam: { name: "山姆", bday: "夏季 17 日", gifts: ["披薩", "仙人掌果實", "楓糖漿", "老虎眼石"] },
      Abigail: { name: "阿比蓋爾", bday: "秋季 13 日", gifts: ["紫水晶", "黑莓脆皮餅", "巧克力蛋糕", "河豚", "南瓜"] },
      Sebastian: { name: "塞巴斯蒂安", bday: "冬季 10 日", gifts: ["冰凍之淚", "黑曜石", "南瓜湯", "生魚片", "虛空蛋"] },
      Alex: { name: "亞歷克斯", bday: "夏季 13 日", gifts: ["全早餐", "鮭魚拼盤"] },
      Elliott: { name: "艾利歐特", bday: "秋季 5 日", gifts: ["螃蟹蛋糕", "鴨毛", "龍蝦", "石榴"] },
      Harvey: { name: "哈維", bday: "冬季 14 日", gifts: ["咖啡", "醃菜", "超級餐", "松露油", "果酒"] },
      Shane: { name: "謝恩", bday: "春季 20 日", gifts: ["啤酒", "辣椒", "披薩", "辣椒波普"] },
      Emily: { name: "艾蜜莉", bday: "春季 27 日", gifts: ["紫水晶", "海藍寶石", "綠寶石", "紅寶石", "布料"] },
      Leah: { name: "莉亞", bday: "冬季 23 日", gifts: ["山羊起司", "沙拉", "炒蔬菜", "果酒"] },
      Clint: { name: "克林特", bday: "冬季 26 日", gifts: ["紫水晶", "金條", "銥條", "翡翠", "紅寶石"] },
      Demetrius: { name: "德米特里厄斯", bday: "夏季 19 日", gifts: ["豆類火鍋", "冰淇淋", "草莓", "大米布丁"] },
      Evelyn: { name: "艾芙琳", bday: "冬季 2 日", gifts: ["巧克力蛋糕", "鑽石", "甜菜", "鬱金香"] },
      George: { name: "喬治", bday: "秋季 24 日", gifts: ["煎蘑菇", "韭蔥"] },
      Gus: { name: "格斯", bday: "夏季 8 日", gifts: ["鑽石", "深色啤酒", "橙子", "法式蝸牛"] },
      Jodi: { name: "喬迪", bday: "秋季 11 日", gifts: ["巧克力蛋糕", "脆皮鱸魚", "煎蛋捲", "蔬菜雜燴"] },
      Linus: { name: "萊納斯", bday: "冬季 3 日", gifts: ["藍莓酸奶", "仙人掌果實", "椰子", "海鮮熱湯"] },
      Marnie: { name: "瑪妮", bday: "秋季 18 日", gifts: ["鑽石", "農夫午餐", "南瓜", "粉紅蛋糕"] },
      Pierre: { name: "皮埃爾", bday: "春季 26 日", gifts: ["炸魷魚"] },
      Vincent: { name: "文森特", bday: "春季 10 日", gifts: ["蔓越莓糖果", "生薑", "粉紅蛋糕", "蝸牛"] },
      Willy: { name: "威利", bday: "春季 24 日", gifts: ["鯰魚", "鑽石", "銥條", "章魚", "海參"] },
      Caroline: { name: "卡洛琳", bday: "冬季 7 日", gifts: ["魚肉捲", "綠茶", "水仙花"] }
    };

    class DotNetRandom {
      constructor(seed) {
        this.seedArray = new Int32Array(56);
        let subtraction = (seed === -2147483648) ? 2147483647 : Math.abs(seed);
        let mj = 161803398 - subtraction;
        this.seedArray[55] = mj;
        let mk = 1;
        for (let i = 1; i < 55; i++) {
          let ii = (21 * i) % 55;
          this.seedArray[ii] = mk;
          mk = mj - mk;
          if (mk < 0) mk += 2147483647;
          mj = this.seedArray[ii];
        }
        for (let k = 1; k < 5; k++) {
          for (let i = 1; i < 56; i++) {
            this.seedArray[i] -= this.seedArray[1 + (i + 30) % 55];
            if (this.seedArray[i] < 0) this.seedArray[i] += 2147483647;
          }
        }
        this.inext = 0;
        this.inextp = 21;
      }
      nextDouble() {
        let locINext = this.inext + 1;
        let locINextp = this.inextp + 1;
        if (locINext >= 56) locINext = 1;
        if (locINextp >= 56) locINextp = 1;
        let retVal = this.seedArray[locINext] - this.seedArray[locINextp];
        if (retVal < 0) retVal += 2147483647;
        this.seedArray[locINext] = retVal;
        this.inext = locINext;
        this.inextp = locINextp;
        return retVal * 4.6566128752457969e-10;
      }
    }

    function predictTomorrow(uniqueId, daysPlayed, season, dayOfMonth) {
      if ((season === "spring" && (dayOfMonth === 13 || dayOfMonth === 24)) ||
          (season === "summer" && (dayOfMonth === 11 || dayOfMonth === 28)) ||
          (season === "fall" && (dayOfMonth === 16 || dayOfMonth === 27)) ||
          (season === "winter" && (dayOfMonth === 8 || dayOfMonth === 25))) {
        return { text: "節日晴朗", icon: "🎉" };
      }
      if (season === "summer" && (dayOfMonth === 13 || dayOfMonth === 26)) {
        return { text: "暴風雨", icon: "⛈️" };
      }

      let seed = Math.floor(uniqueId / 2) + daysPlayed + 1;
      let rng = new DotNetRandom(seed);

      if (season === "winter") {
        return rng.nextDouble() < 0.63 ? { text: "下雪", icon: "❄️" } : { text: "晴天", icon: "☀️" };
      }

      let rainChance = season === "summer" ? 0.12 : (season === "fall" ? 0.18 : 0.183);
      if (dayOfMonth === 1) rainChance = 0.0;

      if (rng.nextDouble() < rainChance) {
        return (season === "summer" && rng.nextDouble() < 0.85)
          ? { text: "雷雨", icon: "⛈️" }
          : { text: "雨天", icon: "🌧️" };
      }
      return { text: "晴天", icon: "☀️" };
    }

    document.getElementById('saveFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('btnText').innerText = "🔄 讀取中...";

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const text = evt.target.result;
          const parser = new DOMParser();
          const xml = parser.parseFromString(text, "application/xml");

          const parseError = xml.querySelector("parsererror");
          if (parseError) {
            throw new Error("XML 解析錯誤");
          }

          // 1. 農夫資訊
          const farmerName = xml.querySelector('player > name')?.textContent || "農夫";
          const farmName = xml.querySelector('player > farmName')?.textContent || "農場";
          const money = parseInt(xml.querySelector('player > money')?.textContent || "0").toLocaleString();
          const year = xml.querySelector('yearForSaveGame')?.textContent || "1";
          const day = parseInt(xml.querySelector('dayOfMonthForSaveGame')?.textContent || "1");
          const seasonIdx = xml.querySelector('seasonForSaveGame')?.textContent || "0";
          const seasons = ["春季", "夏季", "秋季", "冬季"];
          const seasonsEn = ["spring", "summer", "fall", "winter"];
          const seasonStr = seasons[parseInt(seasonIdx)] || "春季";
          const seasonEn = seasonsEn[parseInt(seasonIdx)] || "spring";
          
          let daysPlayed = 1;
          const statItems = xml.querySelectorAll('stats > Values > item');
          for (let item of statItems) {
            if (item.querySelector('key > string')?.textContent === "daysPlayed") {
              daysPlayed = parseInt(item.querySelector('value')?.textContent || "1");
              break;
            }
          }

          const gameId = parseInt(xml.querySelector('UniqueMultiplayerID')?.textContent || "0");

          document.getElementById('dispFarmer').innerText = `${farmerName} 的 ${farmName}農場`;
          document.getElementById('dispMoney').innerText = `${money} G`;
          document.getElementById('dispDate').innerText = `第 ${year} 年・${seasonStr} ${day} 日`;

          // 2. 天氣預測
          const w = predictTomorrow(gameId, daysPlayed, seasonEn, day);
          document.getElementById('dispWeatherIcon').innerText = w.icon;
          document.getElementById('dispWeatherText').innerText = w.text;

          // 3. 農作物統計
          let readyCount = 0;
          let growingCount = 0;
          const crops = xml.querySelectorAll('crop');
          crops.forEach(crop => {
            const currentPhase = parseInt(crop.querySelector('currentPhase')?.textContent || "0");
            const phaseDays = crop.querySelectorAll('phaseDays > int');
            if (phaseDays.length > 0 && currentPhase >= (phaseDays.length - 1)) {
              readyCount++;
            } else {
              growingCount++;
            }
          });
          document.getElementById('readyCount').innerText = readyCount;
          document.getElementById('growingCount').innerText = growingCount;

          // 4. 村民好感度追蹤
          const vContainer = document.getElementById('villagerContainer');
          vContainer.innerHTML = '';
          const friendships = [];
          xml.querySelectorAll('friendshipData > item').forEach(item => {
            const key = item.querySelector('key > string')?.textContent;
            const pts = parseInt(item.querySelector('value > Friendship > Points')?.textContent || "0");
            if (key) friendships.push({ key, pts });
          });

          friendships.sort((a, b) => b.pts - a.pts);

          friendships.forEach(f => {
            const meta = villagerMeta[f.key] || { name: f.key, bday: "未知", gifts: ["暫無最愛物品資料"] };
            const hearts = Math.min(10, Math.floor(f.pts / 250));
            const heartBar = '❤️'.repeat(hearts) + '🤍'.repeat(10 - hearts);
            const giftBadges = meta.gifts.map(g => `<span class="gift-tag">${g}</span>`).join('');

            vContainer.innerHTML += `
              <div class="wood-box villager-card">
                <div class="v-header">
                  <span class="v-name">${meta.name}</span>
                  <span class="v-bday">🎂 ${meta.bday}</span>
                </div>
                <div class="heart-track">${heartBar} <span class="pts-text">(${f.pts}/2500)</span></div>
                <div class="gift-tag-list">${giftBadges}</div>
              </div>`;
          });

          document.getElementById('emptyView').style.display = 'none';
          document.getElementById('mainView').style.display = 'block';
          document.getElementById('btnText').innerText = "🔄 更換存檔";
        } catch (err) {
          alert('解析失敗！請確認選取的是星露谷存檔主檔或 _SVBAK 檔。');
          document.getElementById('btnText').innerText = "📂 讀取存檔";
          console.error(err);
        }
      };

      reader.onerror = function() {
        alert('讀取檔案失敗，請重新選取。');
        document.getElementById('btnText').innerText = "📂 讀取存檔";
      };

      reader.readAsText(file, "UTF-8");
    });
  </script>
</body>
</html>
