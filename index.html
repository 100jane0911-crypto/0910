<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星露谷小助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood-dark: #4A2810;
      --wood-main: #8E5327;
      --wood-border: #D29D64;
      --parchment: #FEE8C8;
      --parchment-deep: #F3CEA1;
      --text-dark: #3F1D0B;
      --text-soft: #7A533E;
      --green-leaf: #388E3C;
      --btn-save: #2E7D32;
      --btn-save-border: #1B5E20;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      padding: 16px;
      padding-bottom: 90px;
      background: #D9BE9B url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" fill="%23D9BE9B"/><rect x="0" y="0" width="20" height="20" fill="%23D3B58E"/></svg>');
      background-size: 20px 20px;
      font-family: 'Zen Maru Gothic', -apple-system, sans-serif;
      color: var(--text-dark);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 3px dashed var(--wood-main);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
      color: var(--wood-dark);
      text-shadow: 1px 1px 0px #FFF;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pixel-btn {
      position: relative;
      background: var(--wood-main);
      color: #FFF;
      border: 3px solid var(--wood-dark);
      box-shadow: inset 2px 2px 0px var(--wood-border), 3px 3px 0px rgba(0,0,0,0.25);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: inset 2px 2px 0px var(--wood-border), 1px 1px 0px rgba(0,0,0,0.25);
    }

    .save-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 99;
    }
    .save-main-btn {
      width: 100%;
      background: var(--btn-save);
      border-color: var(--btn-save-border);
      box-shadow: inset 2px 2px 0px #81C784, 0 4px 10px rgba(0,0,0,0.3);
      font-size: 16px;
      padding: 12px 0;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }
    .file-input-wrapper input[type=file] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      height: 100%;
      width: 100%;
    }

    .wood-box {
      background: var(--parchment);
      border: 4px solid var(--wood-dark);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: inset 0 0 0 3px var(--wood-border), 0 5px 0px rgba(74, 40, 16, 0.3);
    }

    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FAF0DF;
      border: 2px solid var(--wood-border);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 8px;
    }
    .input-row label {
      font-weight: bold;
      font-size: 13px;
      color: var(--wood-dark);
    }
    .pixel-input {
      font-family: 'VT323', monospace;
      font-size: 20px;
      width: 120px;
      padding: 2px 6px;
      border: 2px solid var(--wood-main);
      border-radius: 6px;
      background: #FFF;
      text-align: right;
      color: var(--wood-dark);
    }

    .weather-box {
      background: linear-gradient(135deg, #E6F5F8 0%, #CEE7EE 100%);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .weather-icon { font-size: 42px; }
    .weather-text { font-size: 18px; font-weight: 900; color: #1F4550; }

    .crop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .crop-badge {
      background: #FAF0DF;
      border: 2px solid var(--wood-border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .crop-badge.ready { background: #E8F5E9; border-color: #81C784; }
    .crop-val {
      font-family: 'VT323', monospace;
      font-size: 28px;
      line-height: 1;
      font-weight: bold;
      color: var(--wood-dark);
    }
    .crop-badge.ready .crop-val { color: var(--green-leaf); }
    .crop-lbl { font-size: 11px; font-weight: 700; color: var(--text-soft); }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .action-btn {
      background: #FAF0DF;
      border: 2px solid var(--wood-main);
      color: var(--wood-dark);
      padding: 10px 8px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .action-btn:active { background: #EBDAC2; }
    .action-icon { font-size: 20px; }

    .galaxy-btn {
      background: linear-gradient(135deg, #4A148C 0%, #311B92 100%);
      border-color: #1A237E;
      box-shadow: inset 2px 2px 0px #B39DDB, 3px 3px 0px rgba(0,0,0,0.25);
      color: #FFF;
      width: 100%;
      margin-bottom: 8px;
      padding: 8px 0;
    }

    .villager-card { padding: 10px 12px; margin-bottom: 8px; }
    .v-header { display: flex; justify-content: space-between; align-items: center; }
    .v-name { font-size: 15px; font-weight: 900; color: var(--wood-dark); }
    .v-bday {
      font-size: 10px;
      font-weight: 700;
      background: var(--parchment-deep);
      border: 1px solid var(--wood-border);
      padding: 2px 6px;
      border-radius: 10px;

    .heart-track { font-size: 13px; margin: 4px 0; letter-spacing: 1px; }
    .pts-text { font-family: 'VT323', monospace; font-size: 16px; color: var(--text-soft); }
    .gift-tag-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .gift-tag {

      border: 1px solid #DFCCB7;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #794C2F;
      font-weight: 700;
    }
  </style>
</head>

    class DotNetRandom {
      constructor(seed) {
        this.seedArray = new Int32Array(56);
        let subtraction = (seed === -2147483648) ? 2147483647 : Math.abs(seed);
        let mj = 161803398 - subtraction;
        this.seedArray[55] = mj;
        let mk = 1;
        for (let i = 1; i < 55; i++) {
          let ii = (21 * i) % 55;
          this.seedArray[ii] = mk;
          mk = mj - mk;
          if (mk < 0) mk += 2147483647;
          mj = this.seedArray[ii];
        }
        for (let k = 1; k < 5; k++) {
          for (let i = 1; i < 56; i++) {
            this.seedArray[i] -= this.seedArray[1 + (i + 30) % 55];
            if (this.seedArray[i] < 0) this.seedArray[i] += 2147483647;
          }
        }
        this.inext = 0;
        this.inextp = 21;
      }
      nextDouble() {
        let locINext = this.inext + 1;
        let locINextp = this.inextp + 1;
        if (locINext >= 56) locINext = 1;
        if (locINextp >= 56) locINextp = 1;
        let retVal = this.seedArray[locINext] - this.seedArray[locINextp];
        if (retVal < 0) retVal += 2147483647;
        this.seedArray[locINext] = retVal;
        this.inext = locINext;
        this.inextp = locINextp;
        return retVal * 4.6566128752457969e-10;
      }
    }

    function predictTomorrow(uniqueId, daysPlayed, season, dayOfMonth) {
      if ((season === "spring" && (dayOfMonth === 13 || dayOfMonth === 24)) ||
          (season === "summer" && (dayOfMonth === 11 || dayOfMonth === 28)) ||
          (season === "fall" && (dayOfMonth === 16 || dayOfMonth === 27)) ||
          (season === "winter" && (dayOfMonth === 8 || dayOfMonth === 25))) {
        return { text: "節日晴朗", icon: "🎉" };
      }
      if (season === "summer" && (dayOfMonth === 13 || dayOfMonth === 26)) {
        return { text: "暴風雨", icon: "⛈️" };
      }

      let seed = Math.floor(uniqueId / 2) + daysPlayed + 1;
      let rng = new DotNetRandom(seed);

      if (season === "winter") {
        return rng.nextDouble() < 0.63 ? { text: "下雪", icon: "❄️" } : { text: "晴天", icon: "☀️" };
      }

      let rainChance = season === "summer" ? 0.12 : (season === "fall" ? 0.18 : 0.183);
      if (dayOfMonth === 1) rainChance = 0.0;

      if (rng.nextDouble() < rainChance) {
        return (season === "summer" && rng.nextDouble() < 0.85)
          ? { text: "雷雨", icon: "⛈️" }
          : { text: "雨天", icon: "🌧️" };
      }
      return { text: "晴天", icon: "☀️" };
    }

    function getAllWeapons() {
      if (!rawXmlDoc) return [];
      const allItems = rawXmlDoc.querySelectorAll('Item');
      const weapons = [];
      allItems.forEach(item => {
        const typeAttr = item.getAttribute('xsi:type') || item.getAttribute('type') || '';
        const name = item.querySelector('name')?.textContent || '';
        const hasDmg = item.querySelector('minDamage') || item.querySelector('maxDamage');
        if (typeAttr.includes('MeleeWeapon') || hasDmg || name.toLowerCase().includes('sword') || name.toLowerCase().includes('blade') || name.toLowerCase().includes('dagger') || name.toLowerCase().includes('club')) {
          weapons.push(item);
        }
      });
      return weapons;
    }

    document.getElementById('saveFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      originalFileName = file.name.replace("_SVBAK", "");
      document.getElementById('btnText').innerText = "🔄 讀取中...";

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const text = evt.target.result;
          const parser = new DOMParser();
          rawXmlDoc = parser.parseFromString(text, "application/xml");

          if (rawXmlDoc.querySelector("parsererror")) throw new Error("XML 解析錯誤");

          // 1. 農夫資訊
          const farmerName = rawXmlDoc.querySelector('player > name')?.textContent || "農夫";
          const farmName = rawXmlDoc.querySelector('player > farmName')?.textContent || "農場";
          const moneyVal = parseInt(rawXmlDoc.querySelector('player > money')?.textContent || "0");
          const staminaVal = parseInt(rawXmlDoc.querySelector('player > maxStamina')?.textContent || "270");
          const healthVal = parseInt(rawXmlDoc.querySelector('player > maxHealth')?.textContent || "100");

          const year = rawXmlDoc.querySelector('yearForSaveGame')?.textContent || "1";
          const day = parseInt(rawXmlDoc.querySelector('dayOfMonthForSaveGame')?.textContent || "1");
          const seasonIdx = rawXmlDoc.querySelector('seasonForSaveGame')?.textContent || "0";
          const seasons = ["春季", "夏季", "秋季", "冬季"];
          const seasonsEn = ["spring", "summer", "fall", "winter"];
          const seasonStr = seasons[parseInt(seasonIdx)] || "春季";
          const seasonEn = seasonsEn[parseInt(seasonIdx)] || "spring";
          
          let daysPlayed = 1;
          const statItems = rawXmlDoc.querySelectorAll('stats > Values > item');
          for (let item of statItems) {
            if (item.querySelector('key > string')?.textContent === "daysPlayed") {
              daysPlayed = parseInt(item.querySelector('value')?.textContent || "1");
              break;
            }
          }

          const gameId = parseInt(rawXmlDoc.querySelector('UniqueMultiplayerID')?.textContent || "0");

          document.getElementById('dispFarmer').innerText = `${farmerName} 的 ${farmName}農場`;
          document.getElementById('dispMoney').innerText = `${moneyVal.toLocaleString()} G`;
          document.getElementById('dispDate').innerText = `第 ${year} 年・${seasonStr} ${day} 日`;

          document.getElementById('editMoney').value = moneyVal;
          document.getElementById('editStamina').value = staminaVal;
          document.getElementById('editHealth').value = healthVal;

          // 2. 天氣預測
          const w = predictTomorrow(gameId, daysPlayed, seasonEn, day);
          document.getElementById('dispWeatherIcon').innerText = w.icon;
          document.getElementById('dispWeatherText').innerText = w.text;

          // 3. 作物統計
          let readyCount = 0;
          let growingCount = 0;
          const crops = rawXmlDoc.querySelectorAll('crop');
          crops.forEach(crop => {
            const currentPhase = parseInt(crop.querySelector('currentPhase')?.textContent || "0");
            const phaseDays = crop.querySelectorAll('phaseDays > int');
            if (phaseDays.length > 0 && currentPhase >= (phaseDays.length - 1)) {
              readyCount++;
            } else {
              growingCount++;
            }
          });
          document.getElementById('readyCount').innerText = readyCount;
          document.getElementById('growingCount').innerText = growingCount;

          // 4. 渲染武器清單
          renderWeapons();

          // 5. 渲染寵物與村民
          renderPet();
          renderVillagers();

          document.getElementById('emptyView').style.display = 'none';
          document.getElementById('mainView').style.display = 'block';
          document.getElementById('btnText').innerText = "🔄 更換存檔";
        } catch (err) {
          alert('解析失敗！請確認選取的是星露谷存檔主檔或 _SVBAK 檔。');
          document.getElementById('btnText').innerText = "📂 讀取存檔";
          console.error(err);
        }
      };

      reader.onerror = function() {
        alert('讀取檔案失敗，請重新選取。');
        document.getElementById('btnText').innerText = "📂 讀取存檔";
      };

      reader.readAsText(file, "UTF-8");
    });

    function renderWeapons() {
      const container = document.getElementById('weaponContainer');
      container.innerHTML = '';
      const weapons = getAllWeapons();

      if (weapons.length === 0) {
        container.innerHTML = '<div class="wood-box" style="text-align:center; color:var(--text-soft);">背包與箱子內目前沒有找到近戰武器</div>';
        return;
      }

      weapons.forEach((wNode, idx) => {
        const name = wNode.querySelector('name')?.textContent || "近戰武器";
        const minDmg = wNode.querySelector('minDamage')?.textContent || "1";
        const maxDmg = wNode.querySelector('maxDamage')?.textContent || "3";
        const spd = wNode.querySelector('speed')?.textContent || "0";
        const crit = wNode.querySelector('critChance')?.textContent || "0.02";

        const card = document.createElement('div');
        card.className = 'wood-box';
        card.innerHTML = `
          <div style="font-weight:900; font-size:15px; margin-bottom:8px;">⚔️ 武器名稱：${name}</div>
          <button class="pixel-btn galaxy-btn" onclick="transformToGalaxySword(${idx})">🌌 一鍵幻化為「銀河之劍」(數值破表)</button>
          <div class="input-row">
            <label>傷害範圍 (Min - Max)</label>
            <div style="display:flex; gap:4px; align-items:center;">
              <input type="number" id="w_min_${idx}" class="pixel-input" style="width:60px;" value="${minDmg}" />
              <span>-</span>
              <input type="number" id="w_max_${idx}" class="pixel-input" style="width:60px;" value="${maxDmg}" />
            </div>
          </div>
          <div class="input-row">
            <label>攻擊速度 (Speed)</label>
            <input type="number" id="w_spd_${idx}" class="pixel-input" style="width:80px;" value="${spd}" />
          </div>
          <div class="input-row">
            <label>暴擊機率 (0.0 ~ 1.0)</label>
            <input type="text" id="w_crit_${idx}" class="pixel-input" style="width:80px;" value="${crit}" />
          </div>
          <button class="pixel-btn" onclick="saveWeapon(${idx})" style="width:100%; margin-top:6px; background:#455A64;">套用此武器微調</button>
        `;
        container.appendChild(card);
      });
    }

    window.transformToGalaxySword = function(idx) {
      const weapons = getAllWeapons();
      const wNode = weapons[idx];
      if (!wNode) return;

      let nameNode = wNode.querySelector('name');
      if (!nameNode) { nameNode = rawXmlDoc.createElement('name'); wNode.appendChild(nameNode); }
      nameNode.textContent = "Galaxy Sword";

      let dispNode = wNode.querySelector('DisplayName');
      if (dispNode) dispNode.textContent = "銀河之劍";

      let descNode = wNode.querySelector('description');
      if (!descNode) { descNode = rawXmlDoc.createElement('description'); wNode.appendChild(descNode); }
      descNode.textContent = "它由不可思議的宇宙能量打造而成。";

      const setOrCreate = (tag, val) => {
        let node = wNode.querySelector(tag);
        if (!node) { node = rawXmlDoc.createElement(tag); wNode.appendChild(node); }
        node.textContent = val;
      };

      setOrCreate('parentSheetIndex', '4');
      setOrCreate('initialParentSheetIndex', '4');
      setOrCreate('itemId', '4');
      setOrCreate('QualifiedItemId', '(W)4');

      setOrCreate('minDamage', '999');
      setOrCreate('maxDamage', '9999');
      setOrCreate('speed', '50');
      setOrCreate('critChance', '1.0');
      setOrCreate('critMultiplier', '5.0');

      renderWeapons();
      alert('✨ 成功！該武器已直接幻化為頂級「銀河之劍」，攻擊力拉到 999~9999！');
    };

    window.saveWeapon = function(idx) {
      const weapons = getAllWeapons();
      const wNode = weapons[idx];
      if (!wNode) return;

      const minDmg = document.getElementById(`w_min_${idx}`).value;
      const maxDmg = document.getElementById(`w_max_${idx}`).value;
      const spd = document.getElementById(`w_spd_${idx}`).value;
      const crit = document.getElementById(`w_crit_${idx}`).value;

      const setOrCreate = (tag, val) => {
        let node = wNode.querySelector(tag);
        if (!node) { node = rawXmlDoc.createElement(tag); wNode.appendChild(node); }
        node.textContent = val;
      };

      setOrCreate('minDamage', minDmg);
      setOrCreate('maxDamage', maxDmg);
      setOrCreate('speed', spd);
      setOrCreate('critChance', crit);

      alert('武器屬性已修改！別忘了點擊最下方的「儲存並匯出最新存檔」。');
    };

    // 寵物渲染與滿心邏輯
    function renderPet() {
      const petNode = rawXmlDoc.querySelector('NPC[xsi\\:type="Dog"], NPC[xsi\\:type="Cat"], NPC[xsi\\:type="Pet"]');
      if (!petNode) {
        document.getElementById('petBox').style.display = 'none';
        return;
      }
      document.getElementById('petBox').style.display = 'block';
      const petName = petNode.querySelector('name')?.textContent || "狗狗";
      const petFriendship = parseInt(petNode.querySelector('friendshipTowardFarmer')?.textContent || "0");
      const petHearts = Math.min(5, Math.floor(petFriendship / 200));
      document.getElementById('dispPetName').innerText = `🐶 寵物：${petName}`;
      document.getElementById('dispPetHearts').innerHTML = '❤️'.repeat(petHearts) + '🤍'.repeat(5 - petHearts) + ` <span class="pts-text">(${petFriendship}/1000)</span>`;
    }

    document.getElementById('btnMaxPet').addEventListener('click', function() {
      if (!rawXmlDoc) return;
      const petNodes = rawXmlDoc.querySelectorAll('NPC[xsi\\:type="Dog"], NPC[xsi\\:type="Cat"], NPC[xsi\\:type="Pet"]');
      petNodes.forEach(p => {
        let fNode = p.querySelector('friendshipTowardFarmer');
        if (!fNode) {
          fNode = rawXmlDoc.createElement('friendshipTowardFarmer');
          p.appendChild(fNode);
        }
        fNode.textContent = "1000"; // 寵物滿心為 1000 點
      });
      renderPet();
      alert('🐶 寵物好感度已拉滿至 5 顆心 (1000分)！遊戲內會提示「狗狗非常愛你」！');
    });

    // 村民渲染與滿心
    function renderVillagers() {
      const vContainer = document.getElementById('villagerContainer');
      vContainer.innerHTML = '';
      const friendships = [];
      rawXmlDoc.querySelectorAll('friendshipData > item').forEach(item => {
        const key = item.querySelector('key > string')?.textContent;
        const pts = parseInt(item.querySelector('value > Friendship > Points')?.textContent || "0");
        if (key) friendships.push({ key, pts });
      });

      friendships.sort((a, b) => b.pts - a.pts);

      friendships.forEach(f => {
        const meta = villagerMeta[f.key] || { name: f.key, bday: "未知", gifts: ["暫無資料"] };
        const hearts = Math.min(10, Math.floor(f.pts / 250));
        const heartBar = '❤️'.repeat(hearts) + '🤍'.repeat(10 - hearts);
        const giftBadges = meta.gifts.map(g => `<span class="gift-tag">${g}</span>`).join('');

        const card = document.createElement('div');
        card.className = 'wood-box villager-card';
        card.innerHTML = `
          <div class="v-header">
            <span class="v-name">${meta.name}</span>
            <div style="display:flex; gap:6px; align-items:center;">
              <span class="v-bday">🎂 ${meta.bday}</span>
              <button class="pixel-btn" onclick="maxSingleFriendship('${f.key}')" style="background:#AD1457; border-color:#880E4F; font-size:10px; padding:2px 6px;">💖 10心</button>
            </div>
          </div>
          <div class="heart-track">${heartBar} <span class="pts-text">(${f.pts}/2500)</span></div>
          <div class="gift-tag-list">${giftBadges}</div>
        `;
        vContainer.appendChild(card);
      });
    }

    window.maxSingleFriendship = function(key) {
      const items = rawXmlDoc.querySelectorAll('friendshipData > item');
      for (let item of items) {
        if (item.querySelector('key > string')?.textContent === key) {
          const ptsNode = item.querySelector('value > Friendship > Points');
          if (ptsNode) ptsNode.textContent = "2500";
          break;
        }
      }
      renderVillagers();
    };

    document.getElementById('btnMaxAllHearts').addEventListener('click', function() {
      if (!rawXmlDoc) return;
      const points = rawXmlDoc.querySelectorAll('friendshipData > item > value > Friendship > Points');
      points.forEach(p => p.textContent = "2500");
      renderVillagers();
      alert('所有村民好感度已全部拉滿至 10 心 (2500分)！');
    });

    // 全域工具銥金化
    document.getElementById('btnMaxTools').addEventListener('click', function() {
      if (!rawXmlDoc) return;
      const items = rawXmlDoc.querySelectorAll('Item');
      let count = 0;

      items.forEach(item => {
        const typeAttr = item.getAttribute('xsi:type') || item.getAttribute('type') || '';
        const name = item.querySelector('name')?.textContent || '';
        
        const isTool = typeAttr.includes('Pickaxe') || typeAttr.includes('Axe') || 
                       typeAttr.includes('Hoe') || typeAttr.includes('WateringCan') ||
                       name.includes('Pickaxe') || name.includes('Axe') || 
                       name.includes('Hoe') || name.includes('Watering Can') ||
                       item.querySelector('upgradeLevel') || item.querySelector('UpgradeLevel');

        if (isTool) {
          if (item.querySelector('upgradeLevel')) item.querySelector('upgradeLevel').textContent = "4";
          if (item.querySelector('UpgradeLevel')) item.querySelector('UpgradeLevel').textContent = "4";

          if (typeAttr.includes('Pickaxe') || name.includes('Pickaxe')) {
            if (item.querySelector('name')) item.querySelector('name').textContent = "Iridium Pickaxe";
            if (item.querySelector('QualifiedItemId')) item.querySelector('QualifiedItemId').textContent = "(T)IridiumPickaxe";
            if (item.querySelector('itemId')) item.querySelector('itemId').textContent = "IridiumPickaxe";
          } else if (typeAttr.includes('Axe') || name.includes('Axe')) {
            if (item.querySelector('name')) item.querySelector('name').textContent = "Iridium Axe";
            if (item.querySelector('QualifiedItemId')) item.querySelector('QualifiedItemId').textContent = "(T)IridiumAxe";
            if (item.querySelector('itemId')) item.querySelector('itemId').textContent = "IridiumAxe";
          } else if (typeAttr.includes('Hoe') || name.includes('Hoe')) {
            if (item.querySelector('name')) item.querySelector('name').textContent = "Iridium Hoe";
            if (item.querySelector('QualifiedItemId')) item.querySelector('QualifiedItemId').textContent = "(T)IridiumHoe";
            if (item.querySelector('itemId')) item.querySelector('itemId').textContent = "IridiumHoe";
          } else if (typeAttr.includes('WateringCan') || name.includes('WateringCan') || name.includes('Watering Can')) {
            if (item.querySelector('name')) item.querySelector('name').textContent = "Iridium Watering Can";
            if (item.querySelector('QualifiedItemId')) item.querySelector('QualifiedItemId').textContent = "(T)IridiumWateringCan";
            if (item.querySelector('itemId')) item.querySelector('itemId').textContent = "IridiumWateringCan";
          }
          count++;
        }
      });

      alert(`升級完成！共將 ${count} 件工具升級為「銥金等級」！`);
    });

    // 水壺無限水
    document.getElementById('btnBottomlessWater').addEventListener('click', function() {
      if (!rawXmlDoc) return;
      const items = rawXmlDoc.querySelectorAll('Item');
      let count = 0;
      items.forEach(c => {
        const typeAttr = c.getAttribute('xsi:type') || c.getAttribute('type') || '';
        const name = c.querySelector('name')?.textContent || '';
        if (typeAttr.includes('WateringCan') || name.includes('Watering Can')) {
          let b1 = c.querySelector('isBottomless');
          if (!b1) { b1 = rawXmlDoc.createElement('isBottomless'); c.appendChild(b1); }
          b1.textContent = "true";

          let b2 = c.querySelector('IsBottomless');
          if (!b2) { b2 = rawXmlDoc.createElement('IsBottomless'); c.appendChild(b2); }
          b2.textContent = "true";

          let wNode = c.querySelector('WaterLeft');
          if (wNode) wNode.textContent = "999";
          count++;
        }
      });
      alert(`水壺已改造完成！共 ${count} 支水壺已獲得「無限水量」！`);
    });

    // 道具堆疊 999
    document.getElementById('btnMaxStack').addEventListener('click', function() {
      if (!rawXmlDoc) return;
      const items = rawXmlDoc.querySelectorAll('Item > stack');
      items.forEach(s => {
        const val = parseInt(s.textContent || "0");
        if (val > 1) s.textContent = "999";
      });
      alert('背包與所有儲物箱中現有可堆疊道具，已全部變更為 999 堆疊！');
    });

    // 背包擴充 36 格
    document.getElementById('btnExpandBackpack').addEventListener('click', function() {
      if (!rawXmlDoc) return;
      const mItems = rawXmlDoc.querySelector('player > maxItems');
      if (mItems) mItems.textContent = "36";
      alert('已解鎖 36 格全滿背包容量！');
    });

    // 儲存並匯出
    document.getElementById('btnDownloadSave').addEventListener('click', function() {
      if (!rawXmlDoc) {
        alert('尚未讀取存檔！');
        return;
      }

      const newMoney = document.getElementById('editMoney').value;
      const newStamina = document.getElementById('editStamina').value;
      const newHealth = document.getElementById('editHealth').value;

      const moneyNode = rawXmlDoc.querySelector('player > money');
      const totalEarnedNode = rawXmlDoc.querySelector('player > totalMoneyEarned');
      if (moneyNode) moneyNode.textContent = newMoney;
      if (totalEarnedNode) {
        const curTotal = parseInt(totalEarnedNode.textContent || "0");
        totalEarnedNode.textContent = Math.max(curTotal, parseInt(newMoney));
      }

      const staminaNode = rawXmlDoc.querySelector('player > maxStamina');
      const curStaminaNode = rawXmlDoc.querySelector('player > stamina');
      if (staminaNode) staminaNode.textContent = newStamina;
      if (curStaminaNode) curStaminaNode.textContent = newStamina;

      const healthNode = rawXmlDoc.querySelector('player > maxHealth');
      const curHealthNode = rawXmlDoc.querySelector('player > health');
      if (healthNode) healthNode.textContent = newHealth;
      if (curHealthNode) curHealthNode.textContent = newHealth;

      const serializer = new XMLSerializer();
      let xmlString = serializer.serializeToString(rawXmlDoc);

      if (!xmlString.startsWith('<?xml')) {
        xmlString = '<?xml version="1.0" encoding="utf-8"?>\n' + xmlString;
      }

      const blob = new Blob([xmlString], { type: "application/xml;charset=utf-8" });
      const downloadLink = document.createElement("a");
      downloadLink.href = URL.createObjectURL(blob);
      downloadLink.download = originalFileName;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      alert(`修改完成！已下載檔案「${originalFileName}」，直接放回手機存檔資料夾覆蓋即可。`);
    });
  </script>
</body>
</html>
